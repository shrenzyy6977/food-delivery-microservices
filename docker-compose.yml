version: '3.8'

services:

  postgres:
    image: postgres:15
    container_name: user-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: users_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "3005:3005"
    depends_on:
      - postgres
    environment:
      PORT: 3005
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: admin
      DB_PASSWORD: admin
      DB_NAME: users_db
      JWT_SECRET: supersecretkey
  
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8000:8000"
    depends_on:
      - user-service
    environment:
      PORT: 8000
      JWT_SECRET: supersecretkey
  
  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  

  restaurant-service:
    build: ./restaurant-service
    container_name: restaurant-service
    ports:
      - "3001:3001"
    depends_on:
      - mongodb
    environment:
      PORT: 3001
      MONGO_URI: mongodb://mongodb:27017/restaurants_db

volumes:
    postgres_data:
    mongo_data: